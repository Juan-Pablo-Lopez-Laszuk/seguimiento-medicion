{{define "contenido"}}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <h1 class="h3 mb-3">Iniciar sesión</h1>

    {{with .Datos}}
    {{template "exito" .Exito}}
    {{template "aviso" .Aviso}}
    {{template "error" .Error}}

    <form class="p-4 bg-body rounded-3 shadow-sm" action="/login" method="post" novalidate>
      {{with .Siguiente}}<input type="hidden" name="siguiente" value="{{.}}">{{end}}

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{.Email}}" maxlength="254"
               autocomplete="username" required autofocus>
      </div>

      <div class="mb-3">
        <label class="form-label" for="clave">Contraseña</label>
        <input class="form-control" type="password" id="clave" name="clave" autocomplete="current-password" required>
      </div>

      <div class="d-grid">
        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
      </div>
    </form>

    <p class="mt-3 text-center">¿No tenés cuenta? <a href="/registro">Creá una</a></p>
    {{end}}
  </div>
</div>
{{end}}
