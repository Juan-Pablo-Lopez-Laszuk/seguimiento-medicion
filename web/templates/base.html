{{define "base"}}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Titulo}} · Software Metrics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable d-print-none position-absolute top-0 start-0 m-2 p-2 bg-body rounded" href="#contenido">Ir al contenido</a>

  <nav class="navbar navbar-expand-md bg-primary d-print-none" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="/">Software Metrics</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Abrir el menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/">Inicio</a>
          <a class="nav-link" href="/proyectos">Proyectos</a>
        </div>
      </div>
    </div>
  </nav>

  <main id="contenido" class="container py-4 flex-grow-1">
    {{template "contenido" .}}
  </main>

  <footer class="border-top bg-body py-3 small text-body-secondary d-print-none">
    <div class="container">Software Metrics &amp; Estimation · UTN FRSR</div>
  </footer>
</body>
</html>{{end}}
